<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>

  <title>Interactive Poster</title>

  <!-- Panzoom Library -->
  <script src="https://unpkg.com/@panzoom/panzoom/dist/panzoom.min.js"></script>

  <style>

    body {
      margin: 0;
      overflow: hidden;
      background: #111;
      font-family: Arial, sans-serif;
    }

    #viewer {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #poster-wrapper {
      position: relative;
      width: fit-content;
    }

    #poster {
      width: 1200px;
      display: block;
    }

    /* Hotspots */

    .hotspot {
      position: absolute;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      border: none;
      background: cyan;
      color: black;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 0 20px cyan;
    }

    /* Example hotspot position */
    #hotspot1 {
      top: 35%;
      left: 60%;
    }

    /* Popup */

    .popup {
      position: absolute;
      width: 300px;
      background: white;
      color: black;
      padding: 16px;
      border-radius: 12px;
      display: none;
      z-index: 999;
    }

    #popup1 {
      top: 42%;
      left: 65%;
    }

    .popup.active {
      display: block;
    }

  </style>
</head>

<body>

  <div id="viewer">

    <div id="poster-wrapper">

      <img src="poster.png" id="poster"/>

      <!-- HOTSPOT -->

      <button class="hotspot" id="hotspot1">
        +
      </button>

      <!-- POPUP -->

      <div class="popup" id="popup1">

        <h2>Cognitive Offloading</h2>

        <p>
          AI tools may reduce sustained cognitive effort
          through externalized information processing.
        </p>

      </div>

    </div>

  </div>

  <script>

    // Enable Zoom + Pan

    const elem = document.getElementById('poster-wrapper');

    const panzoom = Panzoom(elem, {
      maxScale: 5,
      minScale: 1
    });

    document
      .getElementById('viewer')
      .addEventListener('wheel', panzoom.zoomWithWheel);

    // Popup interaction

    const hotspot1 = document.getElementById("hotspot1");
    const popup1 = document.getElementById("popup1");

    hotspot1.addEventListener("click", () => {
      popup1.classList.toggle("active");
    });

  </script>

</body>
</html>
